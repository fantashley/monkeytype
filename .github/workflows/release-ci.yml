# Fork only: checks changes to release, the fork's deployed branch.
#
# Runs on PRs against release, and on pushes to the sync/* branches of
# .github/workflows/sync-upstream.yml: their PRs are opened with the
# GITHUB_TOKEN, which doesn't start workflows, so they're checked on push.
# Upstream's Monkey CI only runs for master.
#
# Pushes to release only build the nix packages, to push them to the binary
# cache before dotfiles' daily flake update deploys them.
#
# The nix builds use the Cachix cache named by the CACHIX_CACHE repository
# variable, and push to it with the CACHIX_AUTH_TOKEN secret. Without the
# variable they build without a cache, and without the token (PRs from other
# repositories) they only pull from it.
name: Release CI

on:
  pull_request:
    branches: [release]
  push:
    branches: [release, "sync/**"]

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # this repository's sync branches are checked on push, PRs from other
    # repositories are checked like any other PR whatever their branch name.
    # Pushes to release were checked in their PR.
    if: >-
      github.event_name == 'push' && github.ref_name != 'release' ||
      github.event_name == 'pull_request' && (
        !startsWith(github.head_ref, 'sync/') ||
        github.event.pull_request.head.repo.full_name != github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "./packages/*" --recursive run build
          cp frontend/src/ts/constants/firebase-config-example.ts frontend/src/ts/constants/firebase-config.ts

      - name: Lint
        run: |
          pnpm --filter @monkeytype/backend run lint
          pnpm --filter @monkeytype/frontend run lint
          pnpm --filter @monkeytype/frontend run madge

      - name: Test
        run: |
          pnpm --filter @monkeytype/backend run test
          pnpm --filter @monkeytype/frontend run test

  nix:
    # this repository's sync branches are checked on push, PRs from other
    # repositories are checked like any other PR whatever their branch name
    if: >-
      github.event_name == 'push' ||
      !startsWith(github.head_ref, 'sync/') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # the filtered sources are only used to build
          pushFilter: "-source$"

      - name: Check the pnpm dependency hash
        run: |
          if nix build .#pnpmDeps --no-link 2> build.log; then
            exit 0
          fi
          cat build.log
          hash=$(grep -oE 'got: +sha256-[A-Za-z0-9+/=]+' build.log | awk '{print $2}')
          if [ -n "$hash" ]; then
            echo "::error file=nix/package.nix::The pnpm dependency hash is outdated, set it to $hash"
          fi
          exit 1

      - name: Build the nix packages
        run: nix build .#backend .#frontend -L
